<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Obs. classe">
<title>Grille d'observation – Classe virtuelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,60

<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --primary:#2563eb; --danger:#dc2626;
    --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    padding:24px 16px 80px; max-width:1200px; margin-left:auto; margin-right:auto;
  }
  h1{font-size:1.5rem;margin:0 0 4px}
  h2{font-size:1.05rem;margin:0 0 12px;color:var(--ink)}
  .subtitle{color:var(--muted);font-size:.9rem;margin:0 0 20px}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px 14px;transition:.15s}
  button:hover{border-color:#cbd5e1;background:#f8fafc}
  button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  button.primary:hover{background:#1d4ed8}
  button.danger{color:var(--danger);border-color:#fecaca}
  button.danger:hover{background:#fef2f2}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);margin-bottom:20px}
  .session-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
  input[type=text],input[type=date],textarea,select{
    width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);outline:none;transition:.15s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:90px}

  .add-row{display:flex;gap:10px;flex-wrap:wrap}
  .add-row input{flex:1;min-width:180px}

  .students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  .empty{color:var(--muted);font-style:italic;text-align:center;padding:20px}
  .student-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .student-header{display:flex;align-items:center;gap:8px}
  .student-name{flex:1;font-weight:600;border:none;background:transparent;padding:4px 6px;
    border-radius:6px;font-size:1rem}
  .student-name:hover{background:#f1f5f9}
  .student-name:focus{background:#fff;border:1px solid var(--primary)}
  .total{background:#eff6ff;color:var(--primary);font-weight:700;font-size:.8rem;
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .btn-remove{border:none;background:transparent;color:#cbd5e1;font-size:1rem;padding:4px 8px;border-radius:6px}
  .btn-remove:hover{color:var(--danger);background:#fef2f2}

  /* --- niveaux cognitifs --- */
  .levels{display:flex;gap:5px;flex-wrap:wrap}
  .lvl{font-size:.72rem;padding:5px 9px;border-radius:999px;background:#f8fafc;
    border:1px solid var(--line);color:var(--muted)}
  .lvl.active{background:#1e293b;color:#fff;border-color:#1e293b}

  /* --- qualité --- */
  .quality-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f8fafc;border-radius:9px}
  .quality-label{font-size:.68rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .quality-buttons{display:flex;gap:4px;flex:1}
  .qbtn{flex:1;padding:5px 0;border-radius:7px;border:1px solid var(--line);
    background:#fff;font-size:.75rem;font-weight:700;color:var(--muted);cursor:pointer;
    transition:.15s;line-height:1}
  .qbtn:hover{border-color:#cbd5e1}
  .qbtn.active[data-q="1"]{background:#fef2f2;color:#dc2626;border-color:#fecaca}
  .qbtn.active[data-q="2"]{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
  .qbtn.active[data-q="3"]{background:#fefce8;color:#ca8a04;border-color:#fef08a}
  .qbtn.active[data-q="4"]{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
  .qbtn.active[data-q="5"]{background:#dcfce7;color:#15803d;border-color:#86efac}
  .q-legend{font-size:.65rem;color:var(--muted);font-style:italic;padding-left:2px}

  /* --- types de participation --- */
  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .type-btn{display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:.68rem;line-height:1.2;color:var(--ink)}
  .type-btn:hover{background:color-mix(in srgb, var(--c) 8%, white);border-color:var(--c)}
  .type-btn:active{transform:scale(.96)}
  .type-btn .ico{font-size:1rem}
  .type-btn .cnt{font-weight:700;color:var(--c);font-size:.75rem}

  /* --- journal --- */
  .log-list{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
  .log-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f8fafc;
    border-radius:8px;font-size:.85rem;flex-wrap:wrap}
  .log-time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem;min-width:62px}
  .log-badge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .log-q{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .log-q.q1{background:#fef2f2;color:#dc2626}
  .log-q.q2{background:#fff7ed;color:#ea580c}
  .log-q.q3{background:#fefce8;color:#ca8a04}
  .log-q.q4{background:#f0fdf4;color:#16a34a}
  .log-q.q5{background:#dcfce7;color:#15803d}
  .log-empty{color:var(--muted);font-style:italic;font-size:.85rem}

  @media(max-width:480px){
    .types{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<h1>Grille d'observation – Classe virtuelle</h1>
<p class="subtitle">Choisissez le niveau cognitif et la qualité de l'intervention, puis cliquez sur un type de participation pour l'enregistrer.</p>

<div class="toolbar">
  <button id="btnUndo">↩ Annuler le dernier</button>
  <button class="primary" id="btnExportCsv">⬇ Export CSV (détail)</button>
  <button id="btnExportSummary">⬇ Export CSV (synthèse)</button>
  <button id="btnExportJson">⬇ Export JSON</button>
  <button class="danger" id="btnReset">🗑 Réinitialiser la session</button>
</div>

<section class="panel">
  <h2>Informations de session</h2>
  <div class="session-grid">
    <div><label for="inCours">Cours suivi</label>
      <input type="text" id="inCours" placeholder="ex. Mathématiques – 2de"></div>
    <div><label for="inScenario">Type de classe virtuelle</label>
      <select id="inScenario">
        <option value="">— choisir —</option>
        <option>Visioconférence classique (Zoom/Teams)</option>
        <option>Classe hybride</option>
        <option>Environnement immersif 3D (Gather, métavers)</option>
        <option>Classe virtuelle asynchrone (forum, LMS)</option>
        <option>Autre</option>
      </select></div>
    <div><label for="inDate">Date</label>
      <input type="date" id="inDate"></div>
    <div><label for="inObs">Observateur·rice</label>
      <input type="text" id="inObs" placeholder="Votre nom"></div>
  </div>
</section>

<section class="panel">
  <h2>Ajouter des élèves</h2>
  <div class="add-row">
    <input type="text" id="inStudent" placeholder="Nom de l'élève (ou plusieurs séparés par des virgules)">
    <button class="primary" id="btnAddStudent">+ Ajouter</button>
  </div>
</section>

<section id="studentsGrid" class="students-grid"></section>

<section class="panel">
  <h2>Journal des observations</h2>
  <div id="logList" class="log-list"></div>
</section>

<section class="panel">
  <h2>Notes qualitatives de session</h2>
  <textarea id="notes" placeholder="Observations imprévues, ambiance, incidents techniques, éléments saillants du scénario…"></textarea>
</section>

<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */
const STORAGE_KEY = 'obs-classe-virtuelle-v1';

const TYPES = {
  oral:    { label:'Prise de parole', icon:'🎤', color:'#2563eb' },
  chat:    { label:'Chat',            icon:'💬', color:'#0891b2' },
  sondage: { label:'Sondage / Quiz',  icon:'📊', color:'#7c3aed' },
  question:{ label:'Question posée',  icon:'❓', color:'#ea580c' },
  socio:   { label:'Socio-affectif',  icon:'🤝', color:'#db2777' },
  collab:  { label:'Collaboration',   icon:'👥', color:'#16a34a' }
};

const LEVELS = {
  1:'Restitution', 2:'Reformulation', 3:'Analyse', 4:'Création/transfert'
};

const QUALITY = {
  1:'Faible', 2:'Passable', 3:'Correcte', 4:'Bonne', 5:'Excellente'
};

/* =========================================================
   ÉTAT + MIGRATION
   ========================================================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function emptyCounts(){ return { oral:0, chat:0, sondage:0, question:0, socio:0, collab:0 }; }

let state = loadState() || {
  session: { cours:'', scenario:'', date:todayISO(), observateur:'', notes:'' },
  students: [],
  entries: []
};

/* Migration : garantir quality sur élèves et entrées existantes */
state.students.forEach(s => { if (s.quality === undefined) s.quality = 3; });
state.entries.forEach(e => { if (e.quality === undefined) e.quality = 3; });

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

/* =========================================================
   OUTILS
   ========================================================= */
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('fr-FR',
    {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

/* =========================================================
   SESSION
   ========================================================= */
const inCours = document.getElementById('inCours');
const inScenario = document.getElementById('inScenario');
const inDate = document.getElementById('inDate');
const inObs = document.getElementById('inObs');
const notes = document.getElementById('notes');

function renderSession(){
  inCours.value = state.session.cours || '';
  inScenario.value = state.session.scenario || '';
  inDate.value = state.session.date || todayISO();
  inObs.value = state.session.observateur || '';
  notes.value = state.session.notes || '';
}

const SESSION_KEYS = { inCours:'cours', inScenario:'scenario', inDate:'date', inObs:'observateur' };
Object.keys(SESSION_KEYS).forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    state.session[SESSION_KEYS[id]] = el.value;
    saveState();
  });
});
notes.addEventListener('input', () => { state.session.notes = notes.value; saveState(); });

/* =========================================================
   RENDU ÉLÈVES (avec qualité)
   ========================================================= */
const grid = document.getElementById('studentsGrid');

function renderStudents(){
  if (state.students.length === 0){
    grid.innerHTML = '<p class="empty">Aucun élève pour le moment. Ajoutez-en ci-dessus.</p>';
    return;
  }
  grid.innerHTML = state.students.map(s => {
    const total = Object.values(s.counts).reduce((a,b)=>a+b,0);
    return `
      <div class="student-card" data-id="${s.id}">
        <div class="student-header">
          <input class="student-name" data-id="${s.id}" value="${escapeHtml(s.name)}" aria-label="Nom de l'élève">
          <span class="total" title="Total de participations">${total}</span>
          <button class="btn-remove" data-id="${s.id}" title="Retirer cet élève">✕</button>
        </div>
        <div class="levels" title="Niveau cognitif">
          ${Object.entries(LEVELS).map(([lvl,label]) => `
            <button class="lvl ${s.currentLevel === Number(lvl) ? 'active' : ''}"
                    data-id="${s.id}" data-level="${lvl}">
              ${lvl} · ${label}
            </button>`).join('')}
        </div>
        <div class="quality-row" title="Qualité de l'intervention">
          <span class="quality-label">Qualité</span>
          <div class="quality-buttons">
            ${[1,2,3,4,5].map(q => `
              <button class="qbtn ${s.quality === q ? 'active' : ''}"
                      data-id="${s.id}" data-q="${q}" title="${q} – ${QUALITY[q]}">${q}</button>
            `).join('')}
          </div>
        </div>
        <div class="q-legend">1 Faible · 2 Passable · 3 Correcte · 4 Bonne · 5 Excellente</div>
        <div class="types">
          ${Object.entries(TYPES).map(([key,t]) => `
            <button class="type-btn" data-id="${s.id}" data-type="${key}" style="--c:${t.color}">
              <span class="ico">${t.icon}</span>
              <span class="lbl">${t.label}</span>
              <span class="cnt">${s.counts[key]}</span>
            </button>`).join('')}
        </div>
      </div>`;
  }).join('');
}

/* --- délégation d'événements --- */
grid.addEventListener('click', (e) => {
  const typeBtn = e.target.closest('.type-btn');
  if (typeBtn) return addParticipation(typeBtn.dataset.id, typeBtn.dataset.type);

  const lvlBtn = e.target.closest('.lvl');
  if (lvlBtn){
    const s = state.students.find(x => x.id === lvlBtn.dataset.id);
    if (s){ s.currentLevel = Number(lvlBtn.dataset.level); saveState(); renderStudents(); }
    return;
  }

  const qBtn = e.target.closest('.qbtn');
  if (qBtn){
    const s = state.students.find(x => x.id === qBtn.dataset.id);
    if (s){ s.quality = Number(qBtn.dataset.q); saveState(); renderStudents(); }
    return;
  }

  const removeBtn = e.target.closest('.btn-remove');
  if (removeBtn) return removeStudent(removeBtn.dataset.id);
});

grid.addEventListener('input', (e) => {
  if (e.target.classList.contains('student-name')){
    const s = state.students.find(x => x.id === e.target.dataset.id);
    if (s){ s.name = e.target.value; saveState(); }
  }
});

/* =========================================================
   ACTIONS
   ========================================================= */
const inStudent = document.getElementById('inStudent');

document.getElementById('btnAddStudent').addEventListener('click', addStudents);
inStudent.addEventListener('keydown', e => { if (e.key === 'Enter') addStudents(); });

function addStudents(){
  const raw = inStudent.value.trim();
  if (!raw) return;
  raw.split(',').map(n => n.trim()).filter(Boolean).forEach(name => {
    state.students.push({
      id: uid(),
      name,
      counts: emptyCounts(),
      currentLevel: 1,
      quality: 3
    });
  });
  inStudent.value = '';
  saveState(); renderStudents();
}

function removeStudent(id){
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Retirer « ${s.name} » de la liste ? (ses participations restent dans le journal)`)) return;
  state.students = state.students.filter(x => x.id !== id);
  saveState(); renderStudents();
}

function addParticipation(studentId, type){
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  s.counts[type]++;
  state.entries.push({
    time: new Date().toISOString(),
    studentId,
    studentName: s.name,
    type,
    level: s.currentLevel,
    quality: s.quality
  });
  saveState(); renderStudents(); renderLog();
}

document.getElementById('btnUndo').addEventListener('click', () => {
  const last = state.entries.pop();
  if (!last) return;
  const s = state.students.find(x => x.id === last.studentId);
  if (s && s.counts[last.type] > 0) s.counts[last.type]--;
  saveState(); renderStudents(); renderLog();
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Réinitialiser toute la session (élèves, participations, notes) ?')) return;
  state = {
    session: { cours:'', scenario:'', date:todayISO(), observateur:'', notes:'' },
    students: [], entries: []
  };
  localStorage.removeItem(STORAGE_KEY);
  renderSession(); renderStudents(); renderLog();
});

/* =========================================================
   JOURNAL
   ========================================================= */
const logList = document.getElementById('logList');

function renderLog(){
  if (state.entries.length === 0){
    logList.innerHTML = '<p class="log-empty">Aucune observation enregistrée.</p>';
    return;
  }
  const recent = [...state.entries].slice(-40).reverse();
  logList.innerHTML = recent.map(e => {
    const t = TYPES[e.type];
    return `<div class="log-item">
      <span class="log-time">${fmtTime(e.time)}</span>
      <strong>${escapeHtml(e.studentName)}</strong>
      <span class="log-badge" style="background:${t.color}1a;color:${t.color}">
        ${t.icon} ${t.label}
      </span>
      <span style="color:var(--muted);font-size:.78rem">Niv. ${e.level} · ${LEVELS[e.level]}</span>
      <span class="log-q q${e.quality}" title="${QUALITY[e.quality]}">Q${e.quality} · ${QUALITY[e.quality]}</span>
    </div>`;
  }).join('');
}

/* =========================================================
   EXPORTS
   ========================================================= */
function download(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

/* --- Export détaillé : une ligne par observation --- */
document.getElementById('btnExportCsv').addEventListener('click', () => {
  const header = ['Date','Heure','Cours','Scénario','Élève',
                  'Type de participation','Niveau cognitif','Qualité (1-5)'];
  const rows = state.entries.map(e => {
    const d = new Date(e.time);
    return [
      d.toLocaleDateString('fr-FR'),
      d.toLocaleTimeString('fr-FR'),
      state.session.cours,
      state.session.scenario,
      e.studentName,
      TYPES[e.type].label,
      e.level + ' - ' + LEVELS[e.level],
      e.quality + ' - ' + QUALITY[e.quality]
    ];
  });
  const csv = [header, ...rows].map(r => r.map(csvEscape).join(';')).join('\n');
  download('\uFEFF' + csv, `observations_${state.session.date || todayISO()}.csv`,
           'text/csv;charset=utf-8');
});

/* --- Export synthèse : moyenne de qualité par élève, distribution par type --- */
document.getElementById('btnExportSummary').addEventListener('click', () => {
  const header = ['Élève',
                  ...Object.values(TYPES).map(t => t.label),
                  'Total',
                  'Qualité moyenne',
                  'Niveau moyen'];

  const rows = state.students.map(s => {
    const own = state.entries.filter(e => e.studentId === s.id);
    const total = Object.values(s.counts).reduce((a,b)=>a+b,0);
    const avgQ = own.length ? (own.reduce((a,e)=>a+e.quality,0) / own.length).toFixed(2) : '—';
    const avgL = own.length ? (own.reduce((a,e)=>a+e.level,0) / own.length).toFixed(2) : '—';
    return [
      s.name,
      ...Object.keys(TYPES).map(k => s.counts[k]),
      total,
      avgQ,
      avgL
    ];
  });

  /* Ligne de synthèse par type : qualité moyenne de toutes les observations du type */
  const perType = Object.keys(TYPES).map(k => {
    const own = state.entries.filter(e => e.type === k);
    const avgQ = own.length ? (own.reduce((a,e)=>a+e.quality,0) / own.length).toFixed(2) : '—';
    return [TYPES[k].label + ' — qualité moy.', own.length, avgQ];
  });

  const meta = [
    ['Cours', state.session.cours],
    ['Scénario', state.session.scenario],
    ['Date', state.session.date],
    ['Observateur·rice', state.session.observateur],
    ['Nb observations', state.entries.length],
    []
  ];

  const lines = [
    ...meta.map(r => r.map(csvEscape).join(';')),
    header.map(csvEscape).join(';'),
    ...rows.map(r => r.map(csvEscape).join(';')),
    '',
    'Synthèse par type de participation',
    ['Type','Nb observations','Qualité moyenne'].map(csvEscape).join(';'),
    ...perType.map(r => r.map(csvEscape).join(';'))
  ];

  download('\uFEFF' + lines.join('\n'),
           `synthese_${state.session.date || todayISO()}.csv`,
           'text/csv;charset=utf-8');
});

document.getElementById('btnExportJson').addEventListener('click', () => {
  download(JSON.stringify(state, null, 2),
    `session_${state.session.date || todayISO()}.json`, 'application/json');
});

/* =========================================================
   INITIALISATION
   ========================================================= */
renderSession();
renderStudents();
renderLog();
</script>
</body>
</html>
